# The name of this file shouldn't be changed, or else the Setup Assistant won't detect it
sensors:
  - kinect_pointcloud
kinect_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /kinect/points
  # Diagnostic profile: keep more points to verify octomap pipeline behavior.
  max_range: 3.0
  point_subsample: 1
  # Disable self-filter padding temporarily; if voxels appear, extrinsic/masking is the issue.
  padding_offset: 0.0
  padding_scale: 0.0
  max_update_rate: 5.0
  filtered_cloud_topic: /moveit/filtered_cloud
