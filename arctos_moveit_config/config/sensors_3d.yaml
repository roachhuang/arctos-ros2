# The name of this file shouldn't be changed, or else the Setup Assistant won't detect it
sensors:
  - kinect_pointcloud
kinect_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /kinect/points
  # Kinect v1 balanced profile:
  # keep arm workspace coverage while limiting depth noise/background clutter.
  max_range: 1.3
  point_subsample: 3
  # Robot self-filter padding (slightly increased for Kinect v1 depth jitter).
  padding_offset: 0.04
  padding_scale: 1.0
  # Kinect v1 point cloud is typically ~10-15 Hz; 2 Hz is stable for MoveIt octomap.
  max_update_rate: 2.0
  filtered_cloud_topic: /moveit/filtered_cloud
